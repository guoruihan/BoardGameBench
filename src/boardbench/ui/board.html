 if(!replay){$('challenge').disabled=!state.episode_finished||busy;if(state.episode_finished&&localReplay===null){$('status-pill').textContent=({natural:'自然终局',deadline:'时间截止',stopped:'主动停止'})[state.episode_end_reason]||'对局结束';$('notice').textContent=`${$('status-pill').textContent}，当前局面得分 ${o.score_breakdown.total}。`;}}
}
async function request(url,body){if(busy)return;busy=true;$('error').textContent='';render();let started=performance.now();try{let r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');state=data;if(data.save_id){$('save-id').value=data.save_id;localStorage.setItem('boardbench-save',data.save_id);}if(data.replay_path)$('error').textContent='回放文件：'+data.replay_path;if(url==='/api/new'||url==='/api/load'){offer=0;token=animal=null;localReplay=null;selectedPolicy=data.policy_id;}$('timing').title=`网页请求往返 ${(performance.now()-started).toFixed(1)} ms（含网络，不是纯求解时间）`;}catch(e){$('error').textContent=e.message;auto=false;}finally{busy=false;render();}return state;}
$('new').onclick=()=>{auto=false;request('/api/new',{task_id:$('task').value,...($('seed').value.trim()?{seed:$('seed').value.trim()}:{})});};$('save').onclick=()=>request('/api/save',{});$('load').onclick=()=>request('/api/load',{save_id:$('save-id').value.trim()});$('export').onclick=()=>request('/api/export',{});$('save-id').value=localStorage.getItem('boardbench-save')||'';$('policy').onchange=e=>selectedPolicy=e.target.value;$('hint').onclick=()=>request('/api/hint',{policy_id:selectedPolicy});$('bot-step').onclick=()=>request('/api/bot-step',{policy_id:selectedPolicy});$('adopt').onclick=()=>doAction(state.hint.action);$('reject').onclick=()=>{state.hint=null;render();};async function advance(){if(!auto||!isLive()){auto=false;render();return;}await request('/api/bot-step',{policy_id:selectedPolicy});if(auto&&isLive())setTimeout(advance,120);else{auto=false;render();}}$('auto').onclick=()=>{auto=true;advance();};$('pause').onclick=()=>{auto=false;render();};$('challenge').onclick=()=>request('/api/challenge',{policy_id:selectedPolicy});$('challenge-position').oninput=e=>{localReplay=Number(e.target.value);render();};$('replay-who').onchange=()=>{localReplay=0;$('challenge-position').value=0;render();};$('replay-close').onclick=()=>{localReplay=null;render();};$('prev').onclick=()=>request(`/api/state?episode=${state.episode}&step=${state.step-1}`);$('next').onclick=()=>request(`/api/state?episode=${state.episode}&step=${state.step+1}`);$('episode').onchange=e=>request(`/api/state?episode=${e.target.value}&step=0`);request('/api/state');
$('stop-episode').onclick=()=>doAction({type:'stop_episode'});
setInterval(()=>{if(isLive()&&!busy&&!auto&&state.remaining_seconds!=null)request('/api/state');},1000);
</script></body></html>
